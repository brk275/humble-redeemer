[package]
name = "humble-redeemer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
humble-redeemer-core = { path = "../core" }
anyhow.workspace = true
serde_json.workspace = true
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11"] }
rfd = "0.15"
zeroize = "1"


wry = "0.57"
[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["wgpu"] }
wgpu = { version = "27", default-features = false, features = ["std", "dx12", "wgsl"] }
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
winit = { version = "0.30", default-features = false, features = ["x11"] }
x11-dl = "2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
