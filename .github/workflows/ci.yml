name: Native builds and private-data checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS-arm64
          - os: macos-15-intel
            label: macOS-x64
          - os: windows-2022
            label: Windows-x64
          - os: ubuntu-22.04
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dri libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev libfontconfig1-dev xvfb xauth
      - name: Windows installer tools
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - name: Windows official WebView2 Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
          $signature = Get-AuthenticodeSignature $bootstrapper
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'WebView2 bootstrapper signature verification failed' }
          Start-Process $bootstrapper -ArgumentList '/silent','/install' -Wait
          $runtime = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" -ErrorAction SilentlyContinue
          if (-not $runtime) { throw 'Official WebView2 Runtime was not installed' }
      - name: Privacy audit
        run: python scripts/audit.py
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit and state-machine tests
        run: cargo test --workspace --locked
      - name: Windows sign-in fixture before optimization
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --workspace --locked
          python -c "import sys; sys.path.insert(0, 'scripts'); from pathlib import Path; from package_smoke import exercise; exercise(Path('target/debug').resolve())"
      - name: Build release
        shell: bash
        run: |
          build_workspace_prefix="$PWD"
          build_home_prefix="$HOME"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            build_workspace_prefix="$(cygpath -m "$PWD")"
            build_home_prefix="$(cygpath -m "$HOME")"
          fi
          export RUSTFLAGS="--remap-path-prefix=$build_workspace_prefix=workspace --remap-path-prefix=$build_home_prefix=build-home"
          echo "RUSTFLAGS=$RUSTFLAGS" >> "$GITHUB_ENV"
          cargo build --workspace --release --locked
      - name: Worker, CLI and MCP smoke
        timeout-minutes: 4
        run: python scripts/smoke.py --bin-dir target/release
      - name: Optimized GLib backport regression
        if: runner.os == 'Linux'
        run: cargo test -p humble-redeemer --release --locked glib_string_iterator_backport
      - name: Native GUI launch smoke
        if: runner.os != 'Linux'
        shell: bash
        run: ./target/release/humble-redeemer --smoke-test
      - name: Linux GUI launch smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a ./target/release/humble-redeemer --smoke-test
      - name: Collect dependency license notices
        run: python scripts/notices.py
      - name: Linux AppImage builder
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --proto '=https' https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          echo "APPIMAGETOOL=/tmp/appimagetool" >> "$GITHUB_ENV"
      - name: Package native installers
        run: python scripts/package.py
      - name: Launch and exercise installed or extracted packages
        run: python scripts/package_smoke.py
      - name: Inspect uncompressed packages and installer files
        run: python scripts/audit.py --artifacts dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
  release:
    needs: native
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify packaged checksums
        working-directory: artifacts
        run: for sums in SHA256SUMS-*.txt; do sha256sum --check "$sums"; done
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --prerelease --title "Humble Redeemer $GITHUB_REF_NAME" --notes-file docs/RELEASE.md --verify-tag
